<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn Kanji Pro</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-sub: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #10b981;
            --border: #334155;
        }

        .light-mode {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-sub: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding-bottom: 60px;
            transition: background-color 0.3s;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 {
            font-size: 1.2rem;
            color: var(--primary);
            font-weight: 700;
        }

        .btn-theme {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-color);
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 1rem;
        }

        .nav-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            background: var(--card-bg);
            padding: 0.3rem;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            padding: 0.6rem;
            border: none;
            background: none;
            color: var(--text-sub);
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: white;
        }

        .search-box {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text-color);
            margin-bottom: 1rem;
            font-size: 1rem;
            outline: none;
        }

        .kanji-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 1rem;
        }

        .kanji-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.2rem;
            text-align: center;
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .kanji-card:active {
            transform: scale(0.98);
        }

        .fav-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-sub);
        }

        .fav-btn.active {
            color: #f59e0b;
        }

        .kanji-symbol {
            font-size: 3.5rem;
            font-weight: bold;
            color: var(--text-color);
            margin: 0.3rem 0;
        }

        .meaning {
            font-size: 1rem;
            font-weight: 600;
            color: var(--primary);
        }

        .readings {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-top: 0.4rem;
        }

        .audio-btn {
            margin-top: 0.6rem;
            background: var(--border);
            border: none;
            color: var(--text-color);
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        /* Quiz Styles */
        .quiz-container {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .quiz-kanji {
            font-size: 5rem;
            margin: 1rem 0;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
            margin-top: 1rem;
        }

        .opt-btn {
            background: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-color);
            padding: 0.8rem;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
        }

        .opt-btn.correct { background: #059669; color: white; }
        .opt-btn.wrong { background: #dc2626; color: white; }

        .hidden { display: none; }
    </style>
</head>
<body>

    <header>
        <h1>🇯🇵 Kanji Pro</h1>
        <button class="btn-theme" onclick="toggleTheme()">🌓 Theme</button>
    </header>

    <div class="container">
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('list')">Cards</button>
            <button class="tab-btn" onclick="switchTab('quiz')">Quiz Mode</button>
            <button class="tab-btn" onclick="switchTab('favs')">Saved ⭐</button>
        </div>

        <!-- SEARCH TAB -->
        <div id="list-view">
            <input type="text" class="search-box" id="searchInput" placeholder="Search Kanji, Meaning, Romaji..." oninput="filterKanji()">
            <div class="kanji-grid" id="kanjiGrid"></div>
        </div>

        <!-- QUIZ TAB -->
        <div id="quiz-view" class="hidden">
            <div class="quiz-container">
                <h3>Guess the Meaning!</h3>
                <div class="quiz-kanji" id="quizKanji">日</div>
                <div class="options-grid" id="optionsGrid"></div>
                <p id="quizScore" style="margin-top:1rem; color:var(--text-sub)">Score: 0</p>
            </div>
        </div>

        <!-- FAVS TAB -->
        <div id="fav-view" class="hidden">
            <div class="kanji-grid" id="favGrid"></div>
        </div>
    </div>

    <script>
        const kanjiData = [
            { kanji: "日", meaning: "Sun / Day", bn: "সূর্য / দিন", onyomi: "NICHI, JITSU", kunyomi: "hi, bi", romaji: "hi" },
            { kanji: "月", meaning: "Moon / Month", bn: "চাঁদ / মাস", onyomi: "GETSU, GATSU", kunyomi: "tsuki", romaji: "tsuki" },
            { kanji: "火", meaning: "Fire", bn: "আগুন", onyomi: "KA", kunyomi: "hi", romaji: "hi" },
            { kanji: "水", meaning: "Water", bn: "পানি", onyomi: "SUI", kunyomi: "mizu", romaji: "mizu" },
            { kanji: "木", meaning: "Tree / Wood", bn: "গাছ / কাঠ", onyomi: "MOKU, BOKU", kunyomi: "ki", romaji: "ki" },
            { kanji: "金", meaning: "Gold / Money", bn: "সোনা / টাকা", onyomi: "KIN", kunyomi: "kane", romaji: "kane" },
            { kanji: "土", meaning: "Soil / Earth", bn: "মাটি", onyomi: "TO, DO", kunyomi: "tsuchi", romaji: "tsuchi" },
            { kanji: "山", meaning: "Mountain", bn: "পাহাড়", onyomi: "SAN", kunyomi: "yama", romaji: "yama" },
            { kanji: "川", meaning: "River", bn: "নদী", onyomi: "SEN", kunyomi: "kawa", romaji: "kawa" },
            { kanji: "人", meaning: "Person", bn: "মানুষ", onyomi: "JIN, NIN", kunyomi: "hito", romaji: "hito" }
        ];

        let favorites = JSON.parse(localStorage.getItem('kanji_favs')) || [];
        let quizScore = 0;
        let currentQuizItem = null;

        function renderKanji(items, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = "";
            
            if(items.length === 0) {
                container.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:var(--text-sub)">No Kanji found!</p>`;
                return;
            }

            items.forEach(item => {
                const isFav = favorites.includes(item.kanji);
                const card = document.createElement('div');
                card.className = 'kanji-card';
                card.innerHTML = `
                    <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav('${item.kanji}')">★</button>
                    <div class="kanji-symbol">${item.kanji}</div>
                    <div class="meaning">${item.bn}</div>
                    <div style="font-size:0.8rem; color:var(--text-sub);">${item.meaning}</div>
                    <div class="readings">On: ${item.onyomi}<br>Kun: ${item.kunyomi}</div>
                    <button class="audio-btn" onclick="speakKanji('${item.kanji}')">🔊 Voice</button>
                `;
                container.appendChild(card);
            });
        }

        function speakKanji(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ja-JP';
            window.speechSynthesis.speak(utterance);
        }

        function toggleFav(kanji) {
            if (favorites.includes(kanji)) {
                favorites = favorites.filter(k => k !== kanji);
            } else {
                favorites.push(kanji);
            }
            localStorage.setItem('kanji_favs', JSON.stringify(favorites));
            renderKanji(kanjiData, 'kanjiGrid');
            renderFavs();
        }

        function renderFavs() {
            const favItems = kanjiData.filter(item => favorites.includes(item.kanji));
            renderKanji(favItems, 'favGrid');
        }

        function filterKanji() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = kanjiData.filter(item => 
                item.kanji.includes(query) || 
                item.meaning.toLowerCase().includes(query) ||
                item.bn.includes(query) ||
                item.romaji.toLowerCase().includes(query)
            );
            renderKanji(filtered, 'kanjiGrid');
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            document.getElementById('list-view').classList.add('hidden');
            document.getElementById('quiz-view').classList.add('hidden');
            document.getElementById('fav-view').classList.add('hidden');

            if (tab === 'list') document.getElementById('list-view').classList.remove('hidden');
            if (tab === 'quiz') {
                document.getElementById('quiz-view').classList.remove('hidden');
                nextQuizQuestion();
            }
            if (tab === 'favs') {
                document.getElementById('fav-view').classList.remove('hidden');
                renderFavs();
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
        }

        // Quiz Logic
        function nextQuizQuestion() {
            currentQuizItem = kanjiData[Math.floor(Math.random() * kanjiData.length)];
            document.getElementById('quizKanji').innerText = currentQuizItem.kanji;

            let options = [currentQuizItem];
            while (options.length < 4) {
                let randomItem = kanjiData[Math.floor(Math.random() * kanjiData.length)];
                if (!options.includes(randomItem)) options.push(randomItem);
            }
            options.sort(() => Math.random() - 0.5);

            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.innerText = opt.bn;
                btn.onclick = () => checkAnswer(opt, btn);
                grid.appendChild(btn);
            });
        }

        function checkAnswer(selected, btn) {
            if (selected.kanji === currentQuizItem.kanji) {
                btn.classList.add('correct');
                quizScore += 10;
                speakKanji(currentQuizItem.kanji);
            } else {
                btn.classList.add('wrong');
            }
            document.getElementById('quizScore').innerText = `Score: ${quizScore}`;
                setTimeout(nextQuizQuestion, 1000);
        }

        // Init
        renderKanji(kanjiData, 'kanjiGrid');
    </script>
</body>
</html>
